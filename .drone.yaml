kind: pipeline
type: docker
name: test-pipeline

steps:
  - name: setup-environment
    image: node:14
    commands:
      - npm install

  - name: run-tests
    image: node:14
    commands:
      - npm test

  - name: collect-results
    image: alpine
    commands:
      - echo "Tests completed successfully" > results.txt

secrets:
  - aws_access_key_id
  - aws_secret_access_key